<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>2048</h1>
      <div class="score-box">점수 <strong id="score" aria-live="polite">0</strong></div>
      <button id="new-game" type="button">새 게임</button>
    </header>
    <p class="intro">같은 숫자를 합쳐 2048을 만들어 보세요.</p>
    <div class="board-wrap">
      <div id="board" role="group" aria-label="2048 게임 보드"></div>
      <section id="notice" class="notice" aria-labelledby="notice-title" hidden>
        <h2 id="notice-title"></h2>
        <button id="continue" type="button">계속하기</button>
        <button id="restart" type="button">새 게임</button>
      </section>
    </div>
    <div class="controls" aria-label="이동 방향">
      <button type="button" data-direction="up" aria-label="위로 이동">↑</button>
      <button type="button" data-direction="left" aria-label="왼쪽으로 이동">←</button>
      <button type="button" data-direction="down" aria-label="아래로 이동">↓</button>
      <button type="button" data-direction="right" aria-label="오른쪽으로 이동">→</button>
    </div>
    <p class="help">방향키 또는 화살표 버튼으로 이동하세요.<br>한 번의 이동에서 각 타일은 한 번만 합쳐집니다.</p>
  </main>
</body>
</html>
